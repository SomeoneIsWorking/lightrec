name: Asset-free runtime contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86-64 native dynarec
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.7"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-format clang-tidy cmake liblightning-dev ninja-build
      - name: Run native runtime and source contracts
        run: python tools/verify.py
