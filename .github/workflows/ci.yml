name: Asset-free runtime contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86-64 native dynarec
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out maintained GNU Lightning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SomeoneIsWorking/lightning
          ref: f305e50483e9794e8fb0b99fb77d82954a4924e5
          path: build/deps/lightning
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Select Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.7"
      - name: Select uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.10.12"
          enable-cache: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-format clang-tidy cmake ninja-build
      - name: Build the exact maintained GNU Lightning dependency
        run: >-
          uv run --project build/deps/lightning --frozen --no-python-downloads python
          build/deps/lightning/tools/verify.py --clean --cc clang --jobs 2
      - name: Run native runtime and source contracts
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/build/deps/lightning/build/install/linux-x86_64
        run: uv run --frozen --no-python-downloads python tools/verify.py
