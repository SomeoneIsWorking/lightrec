name: Asset-free runtime contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86-64 native dynarec
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.7"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-format clang-tidy cmake liblightning-dev ninja-build
      - name: Run native runtime and source contracts
        run: python tools/verify.py
